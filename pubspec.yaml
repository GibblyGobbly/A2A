name: universal_converter
description: "A2A: offline file converter and compressor for Android."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.3.0
  ffmpeg_kit_flutter_new: ^4.6.7
  file_picker: ^13.1.0
  image: ^4.10.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  syncfusion_flutter_pdf: ^35.1.37

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/licenses/
    - LICENSE

  # Bundled so the app never fetches fonts over the network. Licensed under the
  # SIL Open Font License; see assets/licenses/OFL-*.txt.
  fonts:
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
