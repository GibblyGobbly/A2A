name: Release

# Runs only when a version tag such as v1.1.0 is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One APK that carries only arm64 (phones) and x64 (emulators, Chromebooks).
      - run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Name the APK after the tag
        run: mv build/app/outputs/flutter-apk/app-release.apk "A2A-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: A2A-${{ github.ref_name }}.apk
          generate_release_notes: true
